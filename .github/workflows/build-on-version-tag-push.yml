# Builds when a release is published.
name: Build Workflow

on:
  release:
    types: [published]

env:
  # The SourceMod build for TF2 Rebalanced: its compiler and includes are used
  SOURCEMOD_REPO: kingo-tf/sourcemod

jobs:
  run:
    name: Build Release Package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v1
      with:
        submodules: true

    - name: Get SourceMod
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # The newest release that has a Linux package (its releases are prereleases,
        # and the Linux package is uploaded a while after the release is created)
        url=$(gh api "repos/$SOURCEMOD_REPO/releases?per_page=20" --jq \
          '[.[] | select(.draft | not) | .assets[] | select(.name | test("^sourcemod-.*-linux\\.tar\\.gz$"))][0].browser_download_url // empty')
        if [ -z "$url" ]; then
          echo "::error::No release of $SOURCEMOD_REPO has a Linux package."
          exit 1
        fi
        echo "Using $url"
        mkdir sourcemod
        curl -fsSL "$url" | tar -xz -C sourcemod

    - name: Setup Ninja Build
      uses: ashutoshvarma/setup-ninja@master
      with:
        version: 1.10.0

    - name: Build Files
      run: |
        python3 configure.py --spcomp-dir sourcemod/addons/sourcemod/scripting
        ninja

    - name: Upload Include
      id: upload-release-include
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url  }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps
        asset_path: ./build/scripting/include/tf2utils.inc
        asset_name: tf2utils.inc
        asset_content_type: text/plain

    - name: Upload Plugin
      id: upload-release-plugin
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url  }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps
        asset_path: ./build/plugins/tf2utils.smx
        asset_name: tf2utils.smx
        asset_content_type: application/octet-stream

    - name: Upload Game Config
      id: upload-release-gamedata
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url  }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps
        asset_path: ./build/gamedata/tf2.utils.nosoop.txt
        asset_name: tf2.utils.nosoop.txt
        asset_content_type: text/plain
